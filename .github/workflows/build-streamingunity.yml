name: Build StreamingUnity

on:
  push:
    branches:
      - master
    paths:
      - 'src/en/streamingunity/**'
      - 'core/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - 'common.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-streamingunity.yml'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew :src:en:streamingunity:assembleDebug -x spotlessKotlinCheck

      - name: Generate index.json
        run: python .github/scripts/generate-index.py

      - name: Deploy to repo branch
        run: python .github/scripts/deploy-repo.py
